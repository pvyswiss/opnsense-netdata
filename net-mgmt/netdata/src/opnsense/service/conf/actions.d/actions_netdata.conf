[start]
command:/usr/local/etc/rc.d/netdata start
parameters:
type:script
message:starting Netdata

[stop]
command:/usr/local/etc/rc.d/netdata stop
parameters:
type:script
message:stopping Netdata

[restart]
command:/usr/local/etc/rc.d/netdata restart; /usr/local/etc/rc.d/syslog-ng reload
parameters:
type:script
message:restarting Netdata and reloading syslog-ng

[reload]
command:/usr/local/etc/rc.d/netdata restart; /usr/local/etc/rc.d/syslog-ng reload
parameters:
type:script
message:reloading Netdata configuration and syslog-ng

[status]
command:/usr/local/etc/rc.d/netdata status; exit 0
parameters:
type:script_output
message:request Netdata status

[syslog]
command:/usr/local/etc/rc.d/syslog-ng reload
parameters:
type:script
message:reloading syslog-ng configuration
