{% if helpers.exists('OPNsense.netdata.general.enabled') and OPNsense.netdata.general.enabled == '1' %}
{% if helpers.exists('OPNsense.netdata.general.logshipperEnabled') and OPNsense.netdata.general.logshipperEnabled == '1' %}
{% if helpers.exists('OPNsense.netdata.general.logshipperHost') and OPNsense.netdata.general.logshipperHost != '' %}
# PVY Netdata Logshipper: forward firewall logs to the Netdata Cloud
# pipeline (syslog TLS receiver on otel-logship -> OTLP -> Logs tab).
destination d_netdata_logshipper {
    network(
        "{{ OPNsense.netdata.general.logshipperHost }}"
        transport("tls")
        port({{ OPNsense.netdata.general.logshipperPort }})
        tls(
            peer-verify(optional-untrusted)
        )
        disk-buffer(
            disk-buf-size(104857600)
            reliable(no)
        )
    );
};
log {
    source(src);
    destination(d_netdata_logshipper);
};
{% endif %}
{% endif %}
{% endif %}
