stages:
  - validate
  - drift

# Serial job execution by design (one Docker job at a time).
#
# Image note: docker:cli is Alpine-based and ships update-ca-certificates,
# which runner-injected CA bootstrap requires.
#
# Division of labour:
#   GitLab = light serial validation + drift monitoring (Docker)
#   GitHub = FreeBSD build + package + release (FreeBSD VM runners)

variables:
  GIT_DEPTH: "1"
  # Runner selection is environment-specific — set CI_RUNNER_TAG as a
  # project/group CI variable (e.g. in GitLab CI/CD settings), not in-repo.
  CI_RUNNER_TAG: "docker"

# --- validate: syntax/XML checks, serial, Docker ------------------------------
validate:syntax:
  stage: validate
  image: docker:cli
  tags: [$CI_RUNNER_TAG]
  before_script:
    - apk add --no-cache libxml2-utils diffutils bash
  script:
    - tools/overlay.sh
    - find net-mgmt/netdata/src -name '*.xml' -exec xmllint --noout {} +
    - sh -n net-mgmt/netdata/src/opnsense/scripts/OPNsense/Netdata/setup.sh
    # Overlay integrity: byte-identical copy
    - diff -ru .upstream/plugins/net-mgmt/netdata net-mgmt/netdata
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# --- drift: daily scheduled + default-branch pushes ----------------------------
drift:upstreams:
  stage: drift
  image: docker:cli
  tags: [pvyvault-runner]
  before_script:
    - apk add --no-cache curl diffutils bash
  script:
    # State snapshot (always)
    - tools/monitor/monitor-upstreams.sh > upstream-state.json
    # Port-gap standing advisory (updates issue #port-gap, never fails pipeline)
    - GITLAB_API="https://git.quadcom.ch/api/v4" PROJECT_ID=274 tools/port-gap-issue.sh upstream-state.json || true
    # Wrapper drift detection: actionable = pipeline issue + GitLab issue
    - |
      if ! tools/drift-check.sh > drift.log 2>&1; then
        cat drift.log
        GITLAB_API="https://git.quadcom.ch/api/v4" PROJECT_ID=274 tools/drift-issue.sh drift.log
        exit 1
      fi
    - cat drift.log
  artifacts:
    when: always
    paths: [upstream-state.json, drift.log]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
